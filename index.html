<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d9dde3;--ac:#2563eb;--act:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#e8eaed;--mut:#98a2b3;--bd:#323741;--ac:#5b8cff;--act:#0b1020}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:18px}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 20px;max-width:1200px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.item{padding:10px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:hover,.item.on{background:var(--bg)}
.item b{display:block}
.meta{font-size:12px;color:var(--mut)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:11px;margin-right:4px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:7px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac)}
.imgs img{max-width:100%;max-height:260px;border:1px solid var(--bd);border-radius:6px;margin:6px 6px 0 0}
h3{margin:16px 0 4px;font-size:13px;text-transform:uppercase;color:var(--mut)}
p,ol{margin:0;white-space:pre-wrap}
#err{color:#d92d20;font-size:13px;margin-left:8px}
</style>
</head>
<body>
<header><h1>Bug Tracker</h1><button class="p" id="new">+ New bug</button></header>
<main>
  <div class="card" style="padding:0">
    <div style="padding:10px"><select id="flt"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Fixed</option><option>Closed</option></select></div>
    <div id="list"></div>
  </div>
  <div class="card" id="pane"><p class="meta">Select a bug from the list.</p></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let bugs = [], sel = null, pw = sessionStorage.getItem("pw") || "";
const hdr = (extra = {}) => ({ ...extra, "x-team-password": pw });

async function api(url, opt = {}, retry = true) {
  const r = await fetch(url, opt);
  if (r.status === 401 && retry) {
    pw = prompt("Team password:") || ""; sessionStorage.setItem("pw", pw);
    opt.headers = { ...(opt.headers || {}), "x-team-password": pw };
    return api(url, opt, false);
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

async function load() {
  bugs = await api("/api/bugs");
  renderList();
  if (sel) show(sel);
}

function renderList() {
  const f = $("flt").value;
  const rows = bugs.filter(b => !f || b.status === f);
  $("list").innerHTML = rows.map(b => `
    <div class="item ${b.id === sel ? "on" : ""}" data-id="${esc(b.id)}">
      <b>${esc(b.title)}</b>
      <span class="tag">${esc(b.status)}</span><span class="tag">${esc(b.severity)}</span>
      <span class="meta">${esc(b.id)} · ${new Date(b.createdAt).toLocaleDateString()}</span>
    </div>`).join("") || '<p class="meta" style="padding:12px">No bugs yet.</p>';
}

function show(id) {
  sel = id; renderList();
  const b = bugs.find(x => x.id === id); if (!b) return;
  const steps = String(b.steps || "").split("\n").filter(s => s.trim())
    .map(s => `<li>${esc(s.replace(/^\d+[.)]\s*/, ""))}</li>`).join("");
  const att = (b.attachments || []).map(a =>
    /\.(png|jpe?g|gif|webp)$/i.test(a.url.split("?")[0])
      ? `<a href="${esc(a.url)}" target="_blank"><img src="${esc(a.url)}" alt="${esc(a.name)}"></a>`
      : `<p><a href="${esc(a.url)}" target="_blank">📎 ${esc(a.name)}</a></p>`).join("");
  $("pane").innerHTML = `
    <h2 style="margin:0">${esc(b.title)}</h2>
    <p class="meta">${esc(b.id)} · ${new Date(b.createdAt).toLocaleString()} · by ${esc(b.reporter || "-")}</p>
    <div class="row" style="margin-top:10px">
      <div><span class="meta">Status</span>
        <select id="st">${["Open","In Progress","Fixed","Closed"].map(s => `<option ${s === b.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <div><span class="meta">Severity / Priority</span><p>${esc(b.severity)} / ${esc(b.priority)}</p></div>
      <div><span class="meta">Module</span><p>${esc(b.module || "-")}</p></div>
      <div><span class="meta">Environment</span><p>${esc(b.env || "-")}</p></div>
    </div>
    ${b.pre ? `<h3>Preconditions</h3><p>${esc(b.pre)}</p>` : ""}
    <h3>Steps to reproduce</h3><ol>${steps || "<li>-</li>"}</ol>
    <h3>Expected</h3><p>${esc(b.exp || "-")}</p>
    <h3>Actual</h3><p>${esc(b.act || "-")}</p>
    <h3>Attachments</h3><div class="imgs">${att || '<p class="meta">None</p>'}</div>`;
  $("st").onchange = async e => {
    try { await api("/api/bugs", { method: "PATCH", headers: hdr({ "content-type": "application/json" }), body: JSON.stringify({ id, status: e.target.value }) }); await load(); }
    catch (x) { alert(x.message); }
  };
}

function form() {
  sel = null; renderList();
  const t = (id, l, ph = "") => `<label>${l}</label><input id="${id}" placeholder="${ph}">`;
  const a = (id, l) => `<label>${l}</label><textarea id="${id}"></textarea>`;
  $("pane").innerHTML = `<h2 style="margin:0">New bug</h2>
    ${t("f_title", "Title")}
    <div class="row">
      <div><label>Severity</label><select id="f_severity"><option>Critical</option><option>Major</option><option selected>Minor</option><option>Trivial</option></select></div>
      <div><label>Priority</label><select id="f_priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
      <div>${t("f_module", "Module / Page")}</div><div>${t("f_env", "Environment")}</div>
    </div>
    ${a("f_pre", "Preconditions")}${a("f_steps", "Steps to reproduce (one per line)")}
    ${a("f_exp", "Expected result")}${a("f_act", "Actual result")}${t("f_reporter", "Reporter")}
    <label>Attachments (images, logs, videos; max ~4 MB each)</label>
    <input type="file" id="f_files" multiple>
    <p style="margin-top:14px"><button class="p" id="save">Submit bug</button><span id="err"></span></p>`;
  $("save").onclick = submit;
}

async function submit() {
  const g = k => $("f_" + k).value.trim();
  if (!g("title")) { $("err").textContent = "Title is required"; return; }
  $("save").disabled = true; $("err").textContent = "Saving…";
  try {
    const attachments = [];
    for (const f of $("f_files").files) {
      if (f.size > 4 * 1024 * 1024) throw new Error(f.name + " is over 4 MB");
      attachments.push(await api("/api/upload?name=" + encodeURIComponent(f.name),
        { method: "POST", headers: hdr({ "content-type": f.type || "application/octet-stream" }), body: f }));
    }
    const body = {};
    ["title","severity","priority","module","env","pre","steps","exp","act","reporter"].forEach(k => body[k] = g(k));
    body.attachments = attachments;
    const bug = await api("/api/bugs", { method: "POST", headers: hdr({ "content-type": "application/json" }), body: JSON.stringify(body) });
    await load(); show(bug.id);
  } catch (e) { $("err").textContent = e.message; $("save").disabled = false; }
}

$("list").onclick = e => { const i = e.target.closest(".item"); if (i) show(i.dataset.id); };
$("flt").onchange = renderList;
$("new").onclick = form;
load().catch(e => $("pane").innerHTML = `<p class="meta">Could not load bugs: ${esc(e.message)}</p>`);
</script>
</body>
</html>
